[tool.poetry]
name = "src"
version = "0.1.0"
description = ""
authors = ["name <email>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
playwright = "1.62.0"
prisma = "^0.12"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27"
pytest = "^8.0"
pytest-asyncio = "^0.23"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
