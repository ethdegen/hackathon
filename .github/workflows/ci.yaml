name: CI
on:
    push:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    fastapi:
        runs-on: ubuntu-latest
        container: python:3.12

        defaults:
            run:
                shell: bash
                working-directory: fastapi

        env:
            DATABASE_URL: postgresql://postgres:postgres@database:5432/postgres

        services:
            database:
                image: pgvector/pgvector:pg18-trixie
                env:
                    POSTGRES_PASSWORD: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Git Checkout
              uses: actions/checkout@v4
            - name: Install Poetry
              uses: abatilo/actions-poetry@v2
            - name: Poetry Install
              run: poetry install
            - name: Prisma Validate
              run: poetry run prisma validate
            - name: Prisma Generate
              run: poetry run prisma generate --generator client_py
            - name: Prisma Migrate Deploy
              run: poetry run prisma migrate deploy
            - name: Playwright Install
              run: poetry run playwright install --with-deps chromium
            - name: Pytest
              run: poetry run pytest

    nextapp:
        runs-on: ubuntu-latest
        container: node:24

        defaults:
            run:
                shell: bash
                working-directory: nextapp

        steps:
            - name: Git Checkout
              uses: actions/checkout@v4
            - name: NPM Install
              run: npm install
            - name: Prisma Generate
              run: npx prisma generate --schema ../fastapi/prisma/schema.prisma --generator client_js
            - name: NPM Run Test
              run: npm run test
            - name: NPM Run Lint
              run: npm run lint
            - name: NPM Run Build
              run: npm run build

    nextapp_e2e:
        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash
                working-directory: nextapp

        env:
            CI: "true"
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

        services:
            database:
                image: pgvector/pgvector:pg18-trixie
                ports:
                    - 5432:5432
                env:
                    POSTGRES_PASSWORD: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Git Checkout
              uses: actions/checkout@v4
            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version-file: nextapp/.nvmrc
            - name: NPM Install
              run: npm install
            - name: Prisma Generate
              run: npx prisma generate --schema ../fastapi/prisma/schema.prisma --generator client_js
            - name: Prisma Migrate Deploy
              run: npx prisma migrate deploy --schema ../fastapi/prisma/schema.prisma
            - name: Cache Playwright Browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('nextapp/package.json') }}
            - name: Playwright Install
              run: npx playwright install --with-deps chromium firefox webkit
            - name: Playwright Test
              run: npm run test:e2e
            - name: Upload Playwright Report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: nextapp/playwright-report/
                  retention-days: 7
